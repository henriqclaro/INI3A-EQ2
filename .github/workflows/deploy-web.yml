name: 🚀 Deploy do Front-end Web (dist)

on:
  push:
    branches:
      - main
    paths:
      - "src/front/meu-confeito-app/**"
      - "!src/front/meu-confeito-app/*.md"
      - "!src/front/meu-confeito-app/**/*.md"
      - "!src/front/meu-confeito-app/.vscode/**"
      - "!src/front/meu-confeito-app/eslint.config.js"
      - "!src/front/meu-confeito-app/.prettierrc.json"
      - "!src/front/meu-confeito-app/.prettierignore"
      - "!src/front/meu-confeito-app/.gitignore"
      - "!src/front/meu-confeito-app/.env.example"
      - "!src/front/meu-confeito-app/android/**"
      - "!src/front/meu-confeito-app/ios/**"
      - "!src/front/meu-confeito-app/eas.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Web para o Servidor via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "src/front/meu-confeito-app/package-lock.json"

      - name: 📦 Instalar dependências
        run: |
          cd src/front/meu-confeito-app
          npm ci

      - name: 🏗️ Gerar build Web (dist)
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://eq.projetoscti.com.br/26-meuconfeito/meu-confeito-api' }}
        run: |
          cd src/front/meu-confeito-app
          npx expo export -p web

      - name: 🔑 Configurar autenticação SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key and ensure proper permissions and trailing newline
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Register host in known_hosts to prevent MITM warnings
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: 🚀 Transferir build Web para o servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SERVER_PATH: ${{ secrets.SERVER_PATH || '/var/www/equipes/26-meuconfeito' }}
        run: |
          REMOTE_PATH="${SERVER_PATH%/}"

          # Ensure destination directory exists on the remote host without deleting existing files
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_PATH'"

          # Synchronize contents of dist/ directly into the target root directory without deleting other files
          rsync -avz --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            src/front/meu-confeito-app/dist/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: 🧹 Limpar credenciais temporárias
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
