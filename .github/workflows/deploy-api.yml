name: 🚀 Deploy da API (Back-end)

on:
  push:
    branches:
      - main
    paths:
      - "src/api/meu-confeito-api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy para o Servidor via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: 📦 Preparar arquivos para deploy
        run: |
          mkdir -p deploy-payload

          # Copy package JSON files
          cp src/api/meu-confeito-api/package*.json deploy-payload/

          # Copy TypeScript configuration
          cp src/api/meu-confeito-api/tsconfig.json deploy-payload/

          # Copy Prisma configuration if present
          if [ -f src/api/meu-confeito-api/prisma.config.ts ]; then
            cp src/api/meu-confeito-api/prisma.config.ts deploy-payload/
          fi

          # Copy Prisma schema and migrations
          cp -r src/api/meu-confeito-api/prisma deploy-payload/

          # Copy src directory without the generated folder
          cp -r src/api/meu-confeito-api/src deploy-payload/
          rm -rf deploy-payload/src/generated

          # Log staged files for verification
          echo "Files staged for deployment:"
          ls -la deploy-payload
          ls -la deploy-payload/src

      - name: 🔑 Configurar autenticação SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key and ensure proper permissions and trailing newline
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Register host in known_hosts to prevent MITM warnings
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: 🚀 Transferir arquivos para o servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SERVER_PATH: ${{ secrets.SERVER_PATH || '/var/www/equipes/26-meuconfeito' }}
        run: |
          REMOTE_PATH="${SERVER_PATH%/}/meu-confeito-api"

          # Ensure destination directory exists on the remote host without deleting existing files
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_PATH'"

          # Synchronize files without --delete so files like .env remain intact
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            deploy-payload/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: ⚙️ Instalar dependências e gerar Prisma Client no servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SERVER_PATH: ${{ secrets.SERVER_PATH || '/var/www/equipes/26-meuconfeito' }}
        run: |
          REMOTE_PATH="${SERVER_PATH%/}/meu-confeito-api"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "bash -l -s '$REMOTE_PATH'" << 'EOF'
            set -e
            TARGET="$1"

            # Load NVM or common environment configurations if available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.profile" ] && . "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc"

            echo "Navigating to remote directory: $TARGET"
            cd "$TARGET"

            echo "Installing dependencies..."
            npm install

            echo "Generating Prisma client..."
            npx prisma generate

            echo "Deployment completed successfully!"
          EOF

      - name: 🧹 Limpar credenciais temporárias
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -rf deploy-payload
