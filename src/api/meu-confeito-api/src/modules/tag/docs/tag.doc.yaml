paths:
  /tags:
    post:
      summary: Cadastra uma nova tag
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRegisterSchema'
      responses:
        '201':
          description: Tag cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRegisterResponse'
        '403':
          description: Ação negada por falta de privilégios
        '409':
          description: Tag já existente
    get:
      summary: Busca e lista tags
      tags:
        - Tags
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [USER, PRODUCT, VARIETY, ATTRIBUTE]
      responses:
        '200':
          description: Tags selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSearchResponse'
        '400':
          description: Erro na validação dos dados
  /tags/{id}:
    get:
      summary: Seleciona uma tag específica por ID
      tags:
        - Tags
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID da tag
      responses:
        '200':
          description: Tag selecionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSelectResponse'
        '401':
          description: Token de autenticação ausente ou inválido
        '404':
          description: Tag não encontrada
