components:
  schemas:
    IngredientRegisterResponse:
      type: object
      properties:
        ingredient:
          type: object
          properties:
            id:
              type: integer
            parentId:
              type: integer
              nullable: true
            name:
              type: string
            slug:
              type: string
            aliases:
              type: array
              items:
                type: string
            description:
              type: string
              nullable: true
            category:
              type: string
            baseDimension:
              type: string
              enum:
                - MASS
                - VOLUME
                - COUNT
            baseUnit:
              type: string
              enum:
                - G
                - KG
                - ML
                - L
                - UN
            creatorId:
              type: string
              format: uuid
              nullable: true
            createdAt:
              type: string
              format: date-time
            conversions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  fromUnit:
                    type: string
                  factorToBase:
                    type: number
    IngredientSearchResponse:
      type: object
      properties:
        ingredients:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
              aliases:
                type: array
                items:
                  type: string
              baseDimension:
                type: string
                enum:
                  - MASS
                  - VOLUME
                  - COUNT
              baseUnit:
                type: string
                enum:
                  - G
                  - KG
                  - ML
                  - L
                  - UN
              category:
                type: string
              description:
                type: string
                nullable: true
