components:
  schemas:
    UserRegisterResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            role:
              type: string
              enum:
                - BAKER
                - CUSTOMER
            createdAt:
              type: string
              format: date-time
    UserSelectResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            phone:
              type: string
              nullable: true
            pfpUrl:
              type: string
              format: url
              nullable: true
            role:
              type: string
              enum:
                - BAKER
                - CUSTOMER
            updatedAt:
              type: string
              format: date-time
    UserAvatarUploadResponse:
      type: object
      properties:
        url:
          type: string
          example: /storage/users/b8c6ef2e-749e-4e3a-9694-81d39dcfbd23/avatar.webp
    UserRecipesSelectResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              parent:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
              title:
                type: string
              coverUrl:
                type: string
                format: url
                nullable: true
              status:
                type: string
                enum:
                  - DRAFT
                  - PUBLISHED
                  - ARCHIVED
                  - SUSPENDED
              prepTimeMinutes:
                type: number
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              tags:
                type: array
                items:
                  type: object
                  properties:
                    tag:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        type:
                          type: string
    UserSavesSelectResponse:
      type: object
      properties:
        userSaves:
          type: array
          items:
            type: object
            properties:
              recipe:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  coverUrl:
                    type: string
                    format: url
                    nullable: true
                  profitMargin:
                    type: number
                  overhead:
                    type: number
                  hourlyLabor:
                    type: number
                  packagingCost:
                    type: number
                  prepTimeMinutes:
                    type: number
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            type:
                              type: string
              savedAt:
                type: string
                format: date-time
    UserSaveRecipeResponse:
      type: object
      properties:
        userSavedRecipe:
          type: object
          properties:
            userId:
              type: string
              format: uuid
            recipeId:
              type: string
              format: uuid
            savedAt:
              type: string
              format: date-time
    UserSelectReviewsResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              userId:
                type: string
                format: uuid
              recipeId:
                type: string
                format: uuid
              rating:
                type: integer
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              recipe:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  coverUrl:
                    type: string
                    format: url
                    nullable: true
                  averageRating:
                    type: number
                  totalReviews:
                    type: integer
