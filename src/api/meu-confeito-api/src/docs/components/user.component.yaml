components:
  schemas:
    UserRegisterResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            role:
              type: string
              enum:
                - BAKER
                - CUSTOMER
            createdAt:
              type: string
              format: date-time
    UserSelectResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            phone:
              type: string
              nullable: true
            pfpUrl:
              type: string
              format: url
              nullable: true
            role:
              type: string
              enum:
                - BAKER
                - CUSTOMER
            updatedAt:
              type: string
              format: date-time
    UserRecipesSelectResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              coverUrl:
                type: string
                format: url
                nullable: true
              prepTimeMinutes:
                type: number
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              tags:
                type: array
                items:
                  type: object
                  properties:
                    tag:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        type:
                          type: string
    UserSavesSelectResponse:
      type: object
      properties:
        userSaves:
          type: array
          items:
            type: object
            properties:
              recipe:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  coverUrl:
                    type: string
                    format: url
                    nullable: true
                  profitMargin:
                    type: number
                  overhead:
                    type: number
                  hourlyLabor:
                    type: number
                  packagingCost:
                    type: number
                  prepTimeMinutes:
                    type: number
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            type:
                              type: string
              savedAt:
                type: string
                format: date-time
    UserSaveRecipeResponse:
      type: object
      properties:
        userSavedRecipe:
          type: object
          properties:
            userId:
              type: string
              format: uuid
            recipeId:
              type: string
              format: uuid
            savedAt:
              type: string
              format: date-time
    UserInventorySelectResponse:
      type: object
      properties:
        userInventories:
          type: array
          items:
            type: object
            properties:
              ingredientId:
                type: integer
              currentQuantity:
                type: number
              costPerBaseUnit:
                type: number
                description: Custo por unidade base do ingrediente
              expirationDate:
                type: string
                format: date-time
                nullable: true
                description: Data de validade do item em estoque
              lastUpdated:
                type: string
                format: date-time
              ingredient:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  slug:
                    type: string
                  category:
                    type: string
                  baseDimension:
                    type: string
                    enum:
                      - MASS
                      - VOLUME
                      - COUNT
                  baseUnit:
                    type: string
                    enum:
                      - G
                      - KG
                      - ML
                      - L
                      - UN
                  description:
                    type: string
                    nullable: true
    UserInventoryRegisterResponse:
      type: object
      properties:
        userInventory:
          type: object
          properties:
            userId:
              type: string
              format: uuid
            ingredientId:
              type: integer
            currentQuantity:
              type: number
            costPerBaseUnit:
              type: number
              description: Custo por unidade base do ingrediente
            expirationDate:
              type: string
              format: date-time
              nullable: true
              description: Data de validade do item em estoque
            lastUpdated:
              type: string
              format: date-time
            ingredient:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                slug:
                  type: string
                category:
                  type: string
                baseDimension:
                  type: string
                  enum:
                    - MASS
                    - VOLUME
                    - COUNT
                baseUnit:
                  type: string
                  enum:
                    - G
                    - KG
                    - ML
                    - L
                    - UN
                description:
                  type: string
                  nullable: true
