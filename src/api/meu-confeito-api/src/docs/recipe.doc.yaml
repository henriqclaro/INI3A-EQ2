paths:
  /recipes:
    post:
      summary: Cadastra uma nova receita
      tags:
        - Receitas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeRegisterSchema'
      responses:
        '201':
          description: Receita cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeRegisterResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita pai, ingrediente ou sub-receita não encontrada
        '409':
          description: Conflito de dados (ex. título idêntico ao da receita pai)
    get:
      summary: Busca e lista receitas
      tags:
        - Receitas
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: search
          description: Termo de busca textual. Realiza primeiro a pesquisa pela expressão completa no título e tags das receitas; caso nenhum resultado seja encontrado, a pesquisa por palavras individuais separadas por espaço entra em vigor como alternativa.
          schema:
            type: string
        - in: query
          name: sort
          description: 'Critérios de ordenação separados por vírgula (ex: rating, reviews, saves). Sinônimos aceitos como order ou orderBy. Em caso de múltiplos parâmetros, a ordem define a precedência.'
          schema:
            type: string
          example: rating, reviews
        - in: query
          name: date_limit
          description: 'Limite de data em dias a partir da criação da receita (ex: 30 para receitas dos últimos 30 dias). Sinônimos aceitos como dateLimit, limit_days ou days.'
          schema:
            type: integer
          example: 30
      responses:
        '200':
          description: Receitas selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSearchResponse'
  /recipes/{id}:
    get:
      summary: Seleciona uma receita por ID
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      responses:
        '200':
          description: Receita selecionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSingleSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
    patch:
      summary: Atualiza dados de uma receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdateSchema'
      responses:
        '200':
          description: Receita atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdateResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita ou recurso não encontrado
    delete:
      summary: Exclui uma receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      responses:
        '204':
          description: Receita excluída com sucesso
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
        '409':
          description: Conflito ao excluir receita em uso como sub-receita ou com produções registradas
  /recipes/{id}/users/{userId}:
    get:
      summary: Seleciona uma receita por ID incluindo o estoque do usuário
      tags:
        - Receitas
        - Ingredientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receita com estoque do usuário selecionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSingleSelectUserInventoryResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
  /recipes/{id}/cover:
    patch:
      summary: Atualiza a foto de capa da receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - cover
              properties:
                cover:
                  type: string
                  format: binary
                  description: Arquivo de imagem de capa (JPEG, PNG, WEBP, GIF, AVIF)
      responses:
        '200':
          description: Capa da receita atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeCoverUploadResponse'
        '400':
          description: Formato de imagem inválido ou arquivo ausente
        '401':
          description: Token de autenticação ausente ou inválido
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
        '413':
          description: Arquivo excede o tamanho máximo permitido (5MB)
    delete:
      summary: Exclui a foto de capa da receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      responses:
        '204':
          description: Capa da receita excluída com sucesso
        '401':
          description: Token de autenticação ausente ou inválido
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita ou imagem de capa não encontrada
  /recipes/{id}/visibility:
    patch:
      summary: Atualiza a visibilidade da receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdateVisibilitySchema'
      responses:
        '200':
          description: Visibilidade da receita atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdateVisibilityResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios ou telefone não cadastrado
        '404':
          description: Receita não encontrada
  /recipes/{id}/reviews:
    get:
      summary: Busca e lista as avaliações de uma receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      responses:
        '200':
          description: Avaliações da receita selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSelectRecipeReviewsResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
    post:
      summary: Cadastra uma avaliação para a receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreateReviewSchema'
      responses:
        '201':
          description: Avaliação cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeCreateReviewResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios, receita não publicada ou criador tentando avaliar a própria receita
        '404':
          description: Receita não encontrada
        '409':
          description: Receita já avaliada pelo usuário
    patch:
      summary: Atualiza a avaliação do usuário para uma receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdateReviewSchema'
      responses:
        '200':
          description: Avaliação atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdateReviewResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Avaliação não encontrada
    delete:
      summary: Exclui a avaliação do usuário para uma receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      responses:
        '204':
          description: Avaliação excluída com sucesso
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Avaliação não encontrada
