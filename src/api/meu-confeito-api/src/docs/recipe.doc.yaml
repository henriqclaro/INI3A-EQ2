paths:
  /recipes:
    post:
      summary: Cadastra uma nova receita
      tags:
        - Receitas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeRegisterSchema'
      responses:
        '201':
          description: Receita cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeRegisterResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
    get:
      summary: Busca e lista receitas
      tags:
        - Receitas
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Receitas selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSearchResponse'
  /recipes/{id}:
    get:
      summary: Seleciona uma receita por ID
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      responses:
        '200':
          description: Receita selecionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSingleSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
    patch:
      summary: Atualiza dados de uma receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdateSchema'
      responses:
        '200':
          description: Receita atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdateResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita ou recurso não encontrado
    delete:
      summary: Exclui uma receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      responses:
        '204':
          description: Receita excluída com sucesso
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
        '409':
          description: Conflito ao excluir receita em uso como sub-receita ou com produções registradas
  /recipes/{id}/users/{userId}:
    get:
      summary: Seleciona uma receita por ID incluindo o estoque do usuário
      tags:
        - Receitas
        - Ingredientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receita com estoque do usuário selecionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSingleSelectUserInventoryResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita não encontrada
  /recipes/{id}/visibility:
    patch:
      summary: Atualiza a visibilidade da receita
      tags:
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/RecipeParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdateVisibilitySchema'
      responses:
        '200':
          description: Visibilidade da receita atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdateVisibilityResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios ou telefone não cadastrado
        '404':
          description: Receita não encontrada
