paths:
  /auth/sessions:
    post:
      summary: Realiza o login do usuário
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogInSchema'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogInResponse'
        '401':
          description: Credenciais inválidas
    delete:
      summary: Realiza o logout do usuário
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshOrDeleteSchema'
      responses:
        '204':
          description: Logout realizado com sucesso
  /auth/tokens:
    post:
      summary: Atualiza o token de acesso
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshOrDeleteSchema'
      responses:
        '200':
          description: Token atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshTokenResponse'
        '401':
          description: Token inválido ou expirado
  /auth/password:
    patch:
      summary: Redefine a senha do usuário
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPasswordSchema'
      responses:
        '204':
          description: Senha redefinida com sucesso
        '400':
          description: Erro na validação dos dados ou senha atual inválida
        '401':
          description: Token inválido ou expirado
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
