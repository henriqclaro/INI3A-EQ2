paths:
  /baker-profiles:
    get:
      summary: Busca e lista perfis de confeiteiro por proximidade e tags
      tags:
        - Perfil de Confeiteiro
      parameters:
        - in: query
          name: lat
          required: true
          description: Latitude do ponto de referência
          schema:
            type: number
        - in: query
          name: lng
          required: true
          description: Longitude do ponto de referência
          schema:
            type: number
        - in: query
          name: radius
          required: false
          description: Raio de busca em metros (padrão 10000m)
          schema:
            type: number
            default: 10000
        - in: query
          name: page
          required: false
          description: Página para paginação (início em 0, 10 itens por página)
          schema:
            type: integer
            default: 0
        - in: query
          name: tags
          required: false
          description: Tags para filtro (IDs numéricos ou nomes separados por vírgula)
          schema:
            type: string
      responses:
        '200':
          description: Perfis de confeiteiro selecionados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BakerProfileSelectByLocationResponse'
        '400':
          description: Erro na validação dos dados
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
  /baker-profiles/me:
    post:
      summary: Cadastra o perfil de confeiteiro do usuário autenticado
      tags:
        - Perfil de Confeiteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BakerProfileRegisterSchema'
      responses:
        '201':
          description: Perfil de confeiteiro cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BakerProfileProfileResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios ou telefone não cadastrado
        '404':
          description: Usuário não encontrado
        '409':
          description: Perfil de confeiteiro já cadastrado
        '410':
          description: Usuário suspenso ou excluído
    get:
      summary: Seleciona o perfil de confeiteiro do usuário autenticado
      tags:
        - Perfil de Confeiteiro
      responses:
        '200':
          description: Perfil de confeiteiro selecionado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BakerProfileProfileResponse'
        '404':
          description: Perfil de confeiteiro não encontrado
        '410':
          description: Usuário suspenso ou excluído
    patch:
      summary: Atualiza dados do perfil de confeiteiro do usuário autenticado
      tags:
        - Perfil de Confeiteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BakerProfileUpdateSchema'
      responses:
        '200':
          description: Perfil de confeiteiro atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BakerProfileProfileResponse'
        '400':
          description: Erro na validação dos dados
        '404':
          description: Perfil de confeiteiro não encontrado
        '410':
          description: Usuário suspenso ou excluído
    delete:
      summary: Exclui o perfil de confeiteiro do usuário autenticado
      tags:
        - Perfil de Confeiteiro
      responses:
        '204':
          description: Perfil de confeiteiro excluído com sucesso
        '404':
          description: Perfil de confeiteiro não encontrado
        '410':
          description: Usuário suspenso ou excluído
  /baker-profiles/me/showcase:
    get:
      summary: Seleciona as receitas da vitrine do confeiteiro autenticado
      tags:
        - Perfil de Confeiteiro
      responses:
        '200':
          description: Vitrine de receitas selecionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseListResponse'
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
    post:
      summary: Adiciona uma receita à vitrine do confeiteiro autenticado
      tags:
        - Perfil de Confeiteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseAddShowcaseSchema'
      responses:
        '201':
          description: Receita adicionada à vitrine com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita ou usuário não encontrado
        '409':
          description: Receita já está na vitrine ou não está publicada
        '410':
          description: Usuário suspenso ou excluído
  /baker-profiles/me/showcase/order:
    patch:
      summary: Reordena as receitas na vitrine do confeiteiro autenticado
      tags:
        - Perfil de Confeiteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseReorderShowcaseSchema'
      responses:
        '200':
          description: Vitrine de receitas reordenada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseListResponse'
        '400':
          description: Erro na validação dos dados
        '404':
          description: Receita ou usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
  /baker-profiles/me/showcase/{recipeId}:
    delete:
      summary: Remove uma receita da vitrine do confeiteiro autenticado
      tags:
        - Perfil de Confeiteiro
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            $ref: '#/components/schemas/ShowcaseParamsRecipeSchema'
      responses:
        '204':
          description: Receita removida da vitrine com sucesso
        '400':
          description: Erro na validação dos dados
        '404':
          description: Receita não encontrada na vitrine
        '410':
          description: Usuário suspenso ou excluído
  /baker-profiles/{id}/showcase:
    get:
      summary: Lista as receitas públicas em destaque da vitrine de um confeiteiro
      tags:
        - Perfil de Confeiteiro
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/ShowcaseParamsProfileSchema'
      responses:
        '200':
          description: Vitrine de receitas selecionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseListResponse'
        '400':
          description: Erro na validação dos dados
        '404':
          description: Perfil de confeiteiro não encontrado
        '410':
          description: Usuário suspenso ou excluído
  /baker-profiles/{id}:
    get:
      summary: Seleciona as informações públicas de um perfil de confeiteiro
      tags:
        - Perfil de Confeiteiro
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/BakerProfileParamsSchema'
      responses:
        '200':
          description: Perfil de confeiteiro selecionado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BakerProfilePublicProfileResponse'
        '400':
          description: Erro na validação dos dados
        '404':
          description: Perfil de confeiteiro não encontrado
        '410':
          description: Usuário suspenso ou excluído
