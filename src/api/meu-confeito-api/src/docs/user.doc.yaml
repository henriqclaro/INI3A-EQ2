paths:
  /users:
    post:
      summary: Cadastra um novo usuário
      tags:
        - Usuários
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterSchema'
      responses:
        '201':
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse'
        '400':
          description: Erro na validação dos dados
        '409':
          description: E-mail já em uso
  /users/me/avatar:
    patch:
      summary: Atualiza o avatar do próprio usuário
      tags:
        - Usuários
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Arquivo de imagem do avatar (JPEG, PNG, WEBP, GIF, AVIF)
      responses:
        '200':
          description: Avatar atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvatarUploadResponse'
        '400':
          description: Formato de imagem inválido ou arquivo ausente
        '401':
          description: Token de autenticação ausente ou inválido
        '413':
          description: Arquivo excede o tamanho máximo permitido (5MB)
    delete:
      summary: Exclui o avatar do próprio usuário
      tags:
        - Usuários
      responses:
        '204':
          description: Avatar excluído com sucesso
        '401':
          description: Token de autenticação ausente ou inválido
        '404':
          description: Imagem do avatar não encontrada
  /users/{id}/avatar:
    patch:
      summary: Atualiza o avatar de um usuário específico (exclusivo para administradores)
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Arquivo de imagem do avatar (JPEG, PNG, WEBP, GIF, AVIF)
      responses:
        '200':
          description: Avatar atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvatarUploadResponse'
        '400':
          description: Formato de imagem inválido ou arquivo ausente
        '401':
          description: Token de autenticação ausente ou inválido
        '403':
          description: Ação negada por falta de privilégios de administrador
        '404':
          description: Usuário não encontrado
        '413':
          description: Arquivo excede o tamanho máximo permitido (5MB)
    delete:
      summary: Exclui o avatar de um usuário específico (exclusivo para administradores)
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '204':
          description: Avatar excluído com sucesso
        '401':
          description: Token de autenticação ausente ou inválido
        '403':
          description: Ação negada por falta de privilégios de administrador
        '404':
          description: Usuário ou imagem não encontrada
  /users/{id}:
    get:
      summary: Seleciona um usuário por ID
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '200':
          description: Usuário selecionado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
    patch:
      summary: Atualiza dados de um usuário
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateSchema'
      responses:
        '200':
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
    delete:
      summary: Exclui um usuário
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeleteSchema'
      responses:
        '204':
          description: Usuário excluído com sucesso
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
  /users/{id}/recipes:
    get:
      summary: Seleciona as receitas próprias de um usuário
      description: Retorna as receitas pertencentes ao usuário, com suporte a filtro opcional por status (DRAFT, PUBLISHED, ARCHIVED) e paginação.
      tags:
        - Usuários
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
          description: Filtra as receitas pelo status (DRAFT, PUBLISHED, ARCHIVED)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Número da página (iniciando em 0)
      responses:
        '200':
          description: Receitas selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecipesSelectResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
  /users/{id}/saves:
    get:
      summary: Seleciona as receitas salvas por um usuário
      tags:
        - Usuários
        - Receitas
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '200':
          description: Receitas selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSavesSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
    post:
      summary: Salva uma receita para o usuário
      tags:
        - Usuários
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSaveRecipeSchema'
      responses:
        '201':
          description: Receita salva com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSaveRecipeResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita ou usuário não encontrado
        '409':
          description: Receita já salva pelo usuário
    delete:
      summary: Remove uma receita salva do usuário
      tags:
        - Usuários
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRemoveSaveRecipeSchema'
      responses:
        '204':
          description: Receita salva removida com sucesso
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Receita salva ou usuário não encontrado
  /users/{id}/reviews:
    get:
      summary: Seleciona as avaliações feitas por um usuário
      tags:
        - Usuários
        - Receitas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '200':
          description: Avaliações selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelectReviewsResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
