paths:
  /users:
    post:
      summary: Cadastra um novo usuário
      tags:
        - Usuários
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterSchema'
      responses:
        '201':
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse'
        '400':
          description: Erro na validação dos dados
        '409':
          description: E-mail já em uso
  /users/{id}:
    get:
      summary: Seleciona um usuário por ID
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '201':
          description: Usuário selecionado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
    patch:
      summary: Atualiza dados de um usuário
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateSchema'
      responses:
        '201':
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
    delete:
      summary: Exclue um usuário
      tags:
        - Usuários
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeleteSchema'
      responses:
        '204':
          description: Usuário excluído com sucesso
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Usuário não encontrado
        '410':
          description: Usuário suspenso ou excluído
  /users/{id}/recipes:
    get:
      summary: Seleciona as receitas próprias de um usuário
      tags:
        - Usuários
        - Receitas
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '201':
          description: Receitas selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecipesSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
  /users/{id}/saves:
    get:
      summary: Seleciona as receitas salvas por um usuário
      tags:
        - Usuários
        - Receitas
      parameters:
        - in: path
          name: id
          required: true,
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '201':
          description: Receitas selecionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSavesSelectResponse'
        '403':
          description: Ação negada por falta de privilégios
  /users/{id}/inventories:
    post:
      summary: Cadastra um novo item no estoque do usuário
      tags:
        - Usuários
        - Ingredientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInventoryRegisterSchema'
      responses:
        '201':
          description: Item de estoque cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInventoryRegisterResponse'
        '400':
          description: Erro na validação dos dados
        '403':
          description: Ação negada por falta de privilégios
        '404':
          description: Ingrediente não encontrado
        '409':
          description: Item de estoque já cadastrado para este ingrediente
    get:
      summary: Seleciona os itens de estoque de um usuário
      tags:
        - Usuários
        - Ingredientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/UserParamsSchema'
      responses:
        '200':
          description: Itens de estoque selecionados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInventorySelectResponse'
        '403':
          description: Ação negada por falta de privilégios
